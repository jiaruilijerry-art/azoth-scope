name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo +stable test --locked
      - run: cargo +stable build --release --locked
      - name: Package portable build
        run: Compress-Archive -Path target/release/azoth-scope.exe,README.md,README.zh-CN.md,LICENSE,assets -DestinationPath azoth-scope-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: azoth-scope-windows-x64
          path: azoth-scope-windows-x64.zip
