[package]
name = "azoth-scope"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CPU and GPU history on the ROG Azoth M701 OLED"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[dependencies]
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry"] }
